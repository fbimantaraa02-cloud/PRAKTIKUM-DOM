<!DOCTYPE html>
<html lang='id'>
<head>
    <meta charset='UTF-8'>
    <title>Daftar Belanja</title>
    <style>
        body { font-family: Arial; max-width: 400px; margin: 40px auto; }
        li { margin: 8px 0; }
        li button { margin-left: 10px; }
    </style>
</head>
<body>
    <h2>Daftar Belanja</h2>
    <!-- Tambahan elemen untuk menampilkan penghitung jumlah barang -->
    <p>Jumlah barang: <span id='totalBarang'>0</span></p>

    <input type='text' id='barang' placeholder='Nama barang'>
    <button id='btnTambah'>Tambah</button>
    <ul id='daftar'></ul>

    <script>
        const barang = document.getElementById('barang');
        const btnTambah = document.getElementById('btnTambah');
        const daftar = document.getElementById('daftar');
        const totalBarang = document.getElementById('totalBarang');

        // Fungsi untuk memperbarui angka penghitung jumlah barang
        function updateJumlahBarang() {
            totalBarang.textContent = daftar.children.length;
        }

        // Fungsi utama untuk menambahkan barang
        function tambahBarang() {
            if (barang.value.trim() === '') {
                alert('Isi nama barang dulu ya!');
                return;
            }

            const li = document.createElement('li');
            li.textContent = barang.value;

            const btnHapus = document.createElement('button');
            btnHapus.textContent = 'Hapus';
            btnHapus.addEventListener('click', () => {
                li.remove();
                updateJumlahBarang(); // Berkurang saat dihapus
            });

            li.appendChild(btnHapus);
            daftar.appendChild(li);

            barang.value = '';
            updateJumlahBarang(); // Bertambah saat ditambah
        }

        // Event saat tombol "Tambah" diklik
        btnTambah.addEventListener('click', tambahBarang);

        // Event listener saat tombol Enter ditekan pada input
        barang.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                tambahBarang();
            }
        });
    </script>
</body>
</html>
